<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WORKNEX — Employee Portal (Aadarsh)</title>
  <meta name="description" content="AI-powered asynchronous team progress management platform. Employee Portal for Aadarsh (Team Alpha).">
  <!-- Brand Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230078D4'/><path d='M24 30 L36 70 L48 44 L60 70 L72 30' stroke='white' stroke-width='9' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <!-- Root application mount point -->
  <div id="app-root">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 10%, #1E293B 0%, #0F172A 70%, #0B1329 100%); color: #FFFFFF; font-family: 'Segoe UI', system-ui, sans-serif;">
      <div style="text-align: center;">
        <div style="width: 48px; height: 48px; border: 4px solid #0078D4; border-top-color: transparent; border-radius: 50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite;"></div>
        <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.3px;">WORKNEX</h2>
        <p style="font-size: 13px; color: #94A3B8;">Initializing Employee Portal for Aadarsh...</p>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Core Scripts in Dependency Order -->
  <script src="js/data.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ai-engine.js"></script>
  <script src="js/state.js"></script>
  <script src="js/employee-app.js"></script>

  <script>
    // Initialize employee portal on DOM ready
    document.addEventListener("DOMContentLoaded", () => {
      window.worknexEmployeeApp.render();
    });
  </script>
</body>
</html>
